name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install --upgrade ruff
      - name: Ruff check
        run: ruff check .

  smoke:
    name: Smoke (py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Import package
        run: python -c "import pdf2latex; print('pdf2latex', pdf2latex.__version__)"
      - name: CLI loads
        run: pdf2latex --help
      - name: Run tests (if present)
        run: |
          if [ -d tests ]; then
            pytest -q --cov-fail-under=80
          else
            echo "No tests/ directory yet (see ROADMAP item 2)."
          fi
